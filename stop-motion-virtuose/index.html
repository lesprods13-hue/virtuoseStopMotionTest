<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Stop Motion Virtuose</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
 --bg:#FAF9F6;--surface:#FFFFFF;--soft:#F3F1EC;--line:#E5E2DA;--ink:#1F1D2B;--muted:#6F6B7D;
 --yellow:#FFD43B;--yellow-2:#F2C41F;--violet:#6E56CF;--violet-soft:#EFEBFC;--danger:#D2483C;--stage:#121019;
 --font:"Fredoka","Nunito","Segoe UI Rounded","Segoe UI",system-ui,sans-serif;
 box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
 --bg:#141320;--surface:#1C1A2A;--soft:#252336;--line:#312E46;--ink:#F1EFF7;--muted:#A6A1BA;--violet:#9D8CF2;--violet-soft:#2A2550;--stage:#0B0A12}}
:root[data-theme="dark"]{--bg:#141320;--surface:#1C1A2A;--soft:#252336;--line:#312E46;--ink:#F1EFF7;--muted:#A6A1BA;--violet:#9D8CF2;--violet-soft:#2A2550;--stage:#0B0A12}
*,*::before,*::after{box-sizing:inherit}
[hidden]{display:none!important}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);font-weight:500;font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
h1,h2,h3,h4{font-weight:600;margin:0;line-height:1.15}
.ico{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:none}
.screen{display:none;min-height:100vh}.screen.on{display:block}
.muted{color:var(--muted)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:15px;cursor:pointer;transition:background .15s,border-color .15s;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--yellow);border-color:var(--yellow);color:#1F1D2B}
.btn.primary:hover{background:var(--yellow-2);border-color:var(--yellow-2)}
.btn.violet{background:var(--violet);border-color:var(--violet);color:#fff}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--soft)}
.btn.icon{width:44px;padding:0}
.btn.on{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.btn.danger{color:var(--danger)}
.btn.sm{min-height:36px;padding:0 10px;font-size:14px;border-radius:10px}
.btn.sm.icon{width:36px}
.btn[disabled]{opacity:.4;pointer-events:none}
.btn:focus-visible,.tile:focus-visible,.cell:focus-visible,.chip:focus-visible,.rrow:focus-visible,.ocard:focus-visible{outline:2px solid var(--violet);outline-offset:2px}
.topbar{display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--bg);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:20}
.topbar h2{font-size:22px;flex:1}
.wrap{max-width:860px;margin:0 auto;padding:20px}

/* ---- Accueil ---- */
.home{max-width:460px;margin:0 auto;padding:20px 20px 40px;display:flex;flex-direction:column;gap:28px;min-height:100vh}
.home-top{display:flex;justify-content:flex-end}
.brand{text-align:center;display:flex;flex-direction:column;align-items:center;gap:14px;margin-top:4vh}
.appicon{width:76px;height:76px;border-radius:22px;background:var(--yellow);display:grid;place-items:center;color:#1F1D2B}
.appicon .ico{width:38px;height:38px;stroke-width:1.8}
.brand h1{font-size:40px;letter-spacing:-.3px;line-height:1.05}
.brand h1 span{display:block;color:var(--violet)}
.brand p{margin:0;color:var(--muted);font-size:17px}
.big{min-height:56px;width:100%;font-size:17px;border-radius:16px}
.sec-h{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec-h h3{font-size:16px;color:var(--muted);font-weight:500}
.list{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden}
.rrow{display:flex;gap:12px;align-items:center;width:100%;padding:10px 12px;border:0;border-bottom:1px solid var(--line);background:transparent;text-align:left;cursor:pointer}
.rrow:last-child{border-bottom:0}
.rrow:hover{background:var(--soft)}
.rthumb{width:60px;height:40px;border-radius:8px;background:var(--stage);object-fit:cover;flex:none;display:grid;place-items:center;color:var(--muted);overflow:hidden}
.rthumb img{width:100%;height:100%;object-fit:cover}
.rrow .rt{flex:1;min-width:0}
.rrow .rt b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rrow .rt small{color:var(--muted);font-size:13px}
.home-nav{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.home-nav .btn{min-height:52px;justify-content:flex-start}

/* ---- Studio ---- */
#studio{height:100vh;height:100dvh;flex-direction:column}
#studio.on{display:flex}
.s-top{display:flex;align-items:center;gap:10px;padding:8px 12px;border-bottom:1px solid var(--line);background:var(--surface)}
.pname{flex:1;min-width:60px;border:1.5px solid transparent;background:transparent;border-radius:10px;padding:6px 8px;font-size:18px;font-weight:600}
.pname:hover,.pname:focus{border-color:var(--line);outline:none}
.savestate{font-size:13px;color:var(--muted);white-space:nowrap}
.stepseg{display:flex;background:var(--soft);border-radius:12px;padding:3px;gap:2px}
.stepseg button{border:0;background:transparent;border-radius:9px;padding:7px 12px;font-weight:600;font-size:14px;cursor:pointer;display:flex;align-items:center;gap:6px;color:var(--muted)}
.stepseg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.stepseg button:focus-visible{outline:2px solid var(--violet)}
.s-main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) 320px}
.s-main>*{min-width:0}
.s-left{display:flex;flex-direction:column;min-height:0;min-width:0}
.stage-wrap{flex:1;min-height:0;background:var(--stage);display:flex;align-items:center;justify-content:center;position:relative;overflow:hidden}
.stage-box{position:relative;width:320px;height:180px}
#stage{width:100%;height:100%;display:block;border-radius:10px;background:#000;touch-action:none}
#stage.picking{cursor:crosshair}#stage.placing{cursor:copy}
.badge{position:absolute;top:10px;left:10px;background:rgba(0,0,0,.55);color:#fff;border-radius:999px;padding:3px 10px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;backdrop-filter:blur(4px)}
.badge .dot{width:8px;height:8px;border-radius:50%;background:#FF5A4E}
.badge.frame .dot{background:var(--yellow)}
.hint{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:rgba(18,16,25,.85);color:#fff;border-radius:12px;padding:6px 12px;font-size:14px;display:none;align-items:center;gap:8px;white-space:nowrap;max-width:94%}
.hint.on{display:flex}
.hint .hsw{width:22px;height:22px;border-radius:6px;border:2px solid #fff;flex:none;display:none}
.hint .hsw.on{display:block}
.countdown{position:absolute;inset:0;display:none;align-items:center;justify-content:center;font-size:120px;font-weight:600;color:var(--yellow);pointer-events:none;text-shadow:0 4px 20px rgba(0,0,0,.4)}
.countdown.on{display:flex}
.flash{position:absolute;inset:0;background:#fff;opacity:0;pointer-events:none;border-radius:10px}
.flash.go{animation:fl .3s ease-out}@keyframes fl{0%{opacity:.8}100%{opacity:0}}
.nocam{position:absolute;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;color:#fff;padding:20px;background:rgba(10,9,16,.6);border-radius:10px}
.nocam.on{display:flex}.nocam p{margin:0;max-width:34ch}
.nocam .row2{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.hidden-video{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.bar{display:flex;align-items:center;gap:8px;padding:10px 12px;background:var(--surface);border-top:1px solid var(--line);flex-wrap:wrap;justify-content:center}
.bar .grp{display:flex;align-items:center;gap:6px}
.bar .spacer{flex:1}
.counter{min-width:64px;text-align:center;font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.shutter{width:64px;height:64px;border-radius:50%;background:var(--yellow);border:4px solid var(--surface);box-shadow:0 0 0 2px var(--yellow);display:grid;place-items:center;color:#1F1D2B;cursor:pointer;margin:0 8px}
.shutter:hover{background:var(--yellow-2)}.shutter:active{transform:scale(.95)}
.shutter .ico{width:28px;height:28px}
.shutter:focus-visible{outline:2px solid var(--violet);outline-offset:4px}
.shutter.rec{background:var(--danger);box-shadow:0 0 0 2px var(--danger);color:#fff}
.shutter.rec.live{animation:pulse 1.2s infinite}@keyframes pulse{50%{box-shadow:0 0 0 6px rgba(210,72,60,.35)}}
.strip-wrap{background:var(--soft);border-top:1px solid var(--line)}
.frame-tools{display:none;gap:6px;padding:8px 12px 0;flex-wrap:wrap}.frame-tools.on{display:flex}
.strip{display:flex;gap:6px;overflow-x:auto;padding:10px 12px;scrollbar-width:thin}
.cell{flex:none;height:62px;border-radius:8px;border:2px solid transparent;position:relative;cursor:pointer;background:#000;padding:0;overflow:hidden}
.cell.land{width:110px}.cell.port{width:35px}
.cell img{width:100%;height:100%;object-fit:cover;display:block}
.cell .n{position:absolute;bottom:2px;left:4px;font-size:11px;font-weight:600;color:#fff;text-shadow:0 0 3px #000}
.cell .fxdot{position:absolute;top:4px;right:4px;width:8px;height:8px;border-radius:50%;background:var(--yellow)}
.cell.sel{border-color:var(--violet)}.cell.playing{border-color:var(--yellow)}
.cell.live{width:62px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--surface);border:1.5px dashed var(--line);color:var(--muted);font-size:11px;gap:2px}
.cell.live.sel{border:2px solid var(--violet);color:var(--violet)}
.s-panel{border-left:1px solid var(--line);background:var(--surface);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:2px;padding:8px;border-bottom:1px solid var(--line)}
.tab{flex:1;border:0;background:transparent;border-radius:10px;padding:8px 2px;font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px}
.tab.on{background:var(--violet-soft);color:var(--violet)}
.tab:focus-visible{outline:2px solid var(--violet)}
.pbody{flex:1;overflow-y:auto;padding:16px}
.pane{display:none}.pane.on{display:block}
.pane h3{font-size:18px;margin-bottom:4px}
.pane .sub{font-size:14px;color:var(--muted);margin:0 0 14px}
.pane h4{font-size:14px;color:var(--muted);font-weight:500;margin:18px 0 8px}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:12px 0 6px}
.row label{font-weight:500}
.val{color:var(--muted);font-size:14px;font-variant-numeric:tabular-nums}
input[type=range]{width:100%;accent-color:var(--violet)}
.switch{position:relative;width:46px;height:28px;flex:none}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch span{position:absolute;inset:0;background:var(--line);border-radius:999px;cursor:pointer;transition:background .15s}
.switch span::after{content:"";position:absolute;width:22px;height:22px;left:3px;top:3px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:transform .15s}
.switch input:checked+span{background:var(--violet)}
.switch input:checked+span::after{transform:translateX(18px)}
.switch input:focus-visible+span{outline:2px solid var(--violet);outline-offset:2px}
.pickrow{display:flex;gap:10px;align-items:center;margin:14px 0}
.swatch{width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line);flex:none}
.dots{display:flex;gap:8px;align-items:center}
.dotbtn{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1.5px var(--line);cursor:pointer;padding:0}
.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:12px;scrollbar-width:none}
.chip{border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:14px;font-weight:500;cursor:pointer;white-space:nowrap}
.chip.on{background:var(--ink);border-color:var(--ink);color:var(--bg)}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{border:1.5px solid var(--line);border-radius:12px;padding:0;background:var(--surface);cursor:pointer;overflow:hidden;text-align:left}
.tile canvas{width:100%;display:block;aspect-ratio:16/9;background:#1E1C2B}
.tile .tl{display:block;padding:5px 8px;font-size:13px;font-weight:500}
.tile.on{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet)}
.fxlist{display:flex;flex-direction:column;gap:6px}
.fxitem{border:1.5px solid var(--line);border-radius:12px;padding:8px 10px}
.fxitem.sel{border-color:var(--violet);background:var(--violet-soft)}
.fxitem .top{display:flex;justify-content:space-between;align-items:center;gap:8px;cursor:pointer}
.fxitem .top small{color:var(--muted)}
.fxitem .ctr{display:flex;gap:6px;align-items:center;margin-top:6px}
.meter{height:10px;border-radius:999px;background:var(--soft);overflow:hidden;margin:10px 0}
.meter i{display:block;height:100%;width:0;background:var(--violet);transition:width .08s}
.card{border:1.5px solid var(--line);border-radius:14px;padding:12px 14px;margin:12px 0}
.card b{display:block}
.tipl{margin:0;padding-left:18px;color:var(--muted);font-size:14px}
.tipl li{margin:4px 0}
.dubprog{flex:1;min-width:160px;height:8px;border-radius:999px;background:var(--soft);overflow:hidden}
.dubprog i{display:block;height:100%;width:0;background:var(--yellow)}
@media (max-width:900px){
 #studio{height:auto;min-height:100dvh}
 .s-main{grid-template-columns:minmax(0,1fr);flex:none}
 .stage-wrap{flex:none;height:calc(56.25vw + 20px)}
 #studio.portrait .stage-wrap{height:62vh}
 .s-panel{border-left:0;border-top:1px solid var(--line)}
 .pbody{overflow:visible}
 .stepseg button span{display:none}
 .savestate{display:none}
 #sExport span{display:none}#sExport{width:44px;padding:0}
}

/* ---- Projets ---- */
.ptools{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.search{flex:1;min-width:180px;display:flex;align-items:center;gap:8px;border:1.5px solid var(--line);border-radius:12px;padding:0 12px;background:var(--surface)}
.search input{border:0;background:transparent;flex:1;padding:10px 0;outline:none}
select{border:1.5px solid var(--line);border-radius:12px;padding:0 10px;min-height:44px;background:var(--surface)}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:14px}
.pcard{border:1.5px solid var(--line);border-radius:16px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.pcard .th{aspect-ratio:16/10;background:var(--stage);border:0;padding:0;cursor:pointer;display:grid;place-items:center;color:#55516A;width:100%}
.pcard .th img{width:100%;height:100%;object-fit:contain}
.pcard .th .ico{width:36px;height:36px}
.pcard .info{padding:10px 12px 4px}
.pcard .info b{display:block;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pcard .info small{color:var(--muted);font-size:13px}
.pcard .acts{display:flex;gap:2px;padding:4px 6px 8px}
.empty{text-align:center;padding:48px 20px;border:1.5px dashed var(--line);border-radius:18px}
.empty h3{font-size:22px;margin-bottom:6px}

/* ---- Apprendre ---- */
.learn details{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;margin-bottom:12px;overflow:hidden}
.learn summary{padding:16px 18px;font-weight:600;font-size:18px;cursor:pointer;list-style:none;display:flex;justify-content:space-between;align-items:center}
.learn summary::-webkit-details-marker{display:none}
.learn summary::after{content:"+";font-size:22px;color:var(--muted)}
.learn details[open] summary::after{content:"−"}
.learn .lb{padding:0 18px 18px}
.learn .lb p{margin:0 0 12px;max-width:62ch;color:var(--muted)}
.learn ol,.learn ul{margin:0;padding-left:20px}
.learn li{margin:8px 0}
.learn li b{font-weight:600}
.films{display:flex;flex-direction:column}
.film{display:grid;grid-template-columns:56px 1fr;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.film:first-child{border-top:0}
.film .yr{font-weight:600;color:var(--violet)}
.film b{font-weight:600}
.film small{display:block;color:var(--muted);font-size:14px}

/* ---- Paramètres ---- */
.setgroup{background:var(--surface);border:1.5px solid var(--line);border-radius:16px;overflow:hidden;margin-bottom:16px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.setrow:last-child{border-bottom:0}
.setrow small{display:block;color:var(--muted);font-size:13px}
.seg{display:flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:transparent;border-radius:8px;padding:6px 12px;font-weight:500;cursor:pointer;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* ---- Fenêtres ---- */
.modal{position:fixed;inset:0;background:rgba(15,13,24,.45);display:none;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal.on{display:flex}
.mbox{background:var(--surface);border-radius:20px;box-shadow:0 20px 50px rgba(0,0,0,.25);max-width:460px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.mbox h3{font-size:21px;margin-bottom:12px}
.mbox p{color:var(--muted);margin:0 0 6px}
.macts{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.tinput{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;background:var(--bg);font-size:16px}
.tinput:focus{outline:2px solid var(--violet);border-color:transparent}
.lbl{font-size:14px;color:var(--muted);margin:16px 0 8px}
.orient{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.ocard{border:1.5px solid var(--line);border-radius:14px;background:var(--surface);padding:14px 10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:8px;text-align:center}
.ocard.on{border-color:var(--violet);box-shadow:0 0 0 2px var(--violet);background:var(--violet-soft)}
.ocard .shape{border:2.5px solid currentColor;border-radius:6px;color:var(--muted)}
.ocard.on .shape{color:var(--violet)}
.ocard .shape.l{width:64px;height:36px}.ocard .shape.p{width:28px;height:50px;margin:-7px 0}
.ocard small{color:var(--muted);font-size:13px}
.exopts{display:flex;flex-direction:column;gap:8px}
.exopt{justify-content:flex-start;text-align:left;min-height:58px;gap:12px}
.exopt small{display:block;font-weight:400;font-size:13px;color:var(--muted)}
.exopt.primary small{color:#4A4535}.exopt.red small{color:rgba(255,255,255,.85)}
.progress{height:8px;border-radius:999px;background:var(--soft);overflow:hidden;margin-top:14px;display:none}
.progress.on{display:block}.progress i{display:block;height:100%;width:0;background:var(--violet)}
#exPreview{display:none;max-width:100%;max-height:40vh;margin:14px auto 0;border-radius:10px;background:#000}
#exPreview.on{display:block}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:500;z-index:200;opacity:0;visibility:hidden;transition:opacity .2s,transform .2s;max-width:90vw;text-align:center}
.toast.on{opacity:1;visibility:visible;transform:translateX(-50%) translateY(0)}
@media (prefers-reduced-motion: reduce){*{transition:none!important;animation:none!important}}
/* ---- v1.3 : touches sympas + fond vert pro ---- */
.btn{transition:background .15s,border-color .15s,transform .12s ease}
.btn:active{transform:scale(.96)}
.screen.on{animation:scrIn .28s ease}
@keyframes scrIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#home{position:relative;overflow:hidden}
.hglow{position:absolute;inset:0;pointer-events:none;z-index:0}
.hglow::before,.hglow::after{content:"";position:absolute;border-radius:50%;filter:blur(80px)}
.hglow::before{width:420px;height:420px;background:var(--yellow);opacity:.35;top:-140px;left:calc(50% - 380px)}
.hglow::after{width:380px;height:380px;background:var(--violet);opacity:.18;top:60px;left:calc(50% + 40px)}
.home{position:relative;z-index:1}
.appicon{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.appicon:hover{transform:rotate(-8deg) scale(1.05)}
.big .ico{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.big:hover .ico{transform:rotate(90deg)}
.idea{display:flex;align-items:center;gap:8px;background:var(--surface);border:1.5px solid var(--line);border-radius:16px;padding:10px 10px 10px 16px}
.idea-tx{flex:1;min-width:0}
.idea-tx small{display:block;color:var(--muted);font-size:13px}
.idea-tx b{font-weight:600;display:block}
.idea-tx b.swap{animation:swap .3s ease}
@keyframes swap{from{opacity:0;transform:translateY(8px)}}
#ideaShuffle.spin .ico{animation:spin .45s ease}
@keyframes spin{to{transform:rotate(360deg)}}
.rrow{transition:background .15s}
.rrow:hover .rthumb{transform:scale(1.05)}
.rthumb{transition:transform .2s}
.tile{transition:transform .15s,border-color .15s}
.tile:hover{transform:translateY(-2px)}
@media (prefers-reduced-motion: reduce){.screen.on,.idea-tx b.swap{animation:none}}

.kview{margin:4px 0 6px}
.seg.wide{display:flex}.seg.wide button{flex:1}
.kstep{display:flex;align-items:center;gap:8px;margin:20px 0 10px;padding-top:14px;border-top:1px solid var(--line)}
.kn{width:22px;height:22px;border-radius:50%;background:var(--yellow);color:#1F1D2B;font-size:13px;font-weight:600;display:grid;place-items:center;flex:none}
.kstep b{font-weight:600}
.keys{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.key{position:relative;width:44px;height:44px;border-radius:12px;border:1.5px solid var(--line)}
.key button{position:absolute;top:-7px;right:-7px;width:20px;height:20px;border-radius:50%;border:0;background:var(--ink);color:var(--bg);font-size:13px;line-height:1;cursor:pointer;padding:0}
.keys .empty-k{font-size:14px;color:var(--muted);padding:10px 12px;border:1.5px dashed var(--line);border-radius:12px;width:100%}
.pickrow{margin:0 0 10px}
#cPickAdd.on,#cPick.on{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.gtile{aspect-ratio:16/9;cursor:pointer;position:relative}
.gtile img{width:100%;height:100%;object-fit:cover;display:block}
.gdel{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;cursor:pointer;font-size:14px;line-height:1;padding:0}
.addtile{aspect-ratio:16/9;display:grid;place-items:center;border-style:dashed;color:var(--muted)}
.addin{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:13px;font-weight:500}
/* ===== v1.4 : style jeu (contours, ombres franches, rouge et jaune) ===== */
:root{--bg:#FFF7E6;--surface:#FFFFFF;--soft:#FFF0CC;--ink:#22203F;--muted:#6B6785;--edge:#22203F;--line:color-mix(in srgb,var(--ink) 16%,transparent);
 --red:#FF4D4D;--red-2:#EC3B3B;--blue:#3BA7FF;--yellow:#FFC21A;--yellow-2:#F2B200;--violet:#6E56CF}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#17152B;--surface:#242140;--soft:#2E2A52;--ink:#FFF3DC;--muted:#B9B3D6;--edge:#07061A;--violet:#9D8CF2}}
:root[data-theme="dark"]{--bg:#17152B;--surface:#242140;--soft:#2E2A52;--ink:#FFF3DC;--muted:#B9B3D6;--edge:#07061A;--violet:#9D8CF2}
body{background-color:var(--bg);background-image:radial-gradient(color-mix(in srgb,var(--ink) 10%,transparent) 1.2px,transparent 1.4px);background-size:22px 22px}
h1,h2,h3{font-weight:700}
.btn{border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);border-radius:14px;font-weight:600;transition:transform .08s,box-shadow .08s,background .15s;margin-bottom:4px}
.btn:hover{transform:translateY(-1px);box-shadow:0 5px 0 var(--edge);border-color:var(--edge)}
.btn:active{transform:translateY(4px);box-shadow:0 0 0 var(--edge)}
.btn.ghost{border-color:transparent;box-shadow:none;margin-bottom:0}
.btn.ghost:hover{transform:none;box-shadow:none;background:var(--soft)}
.btn.ghost:active{transform:scale(.92)}
.btn.primary,.btn.yellow{background:var(--yellow);border-color:var(--edge);color:#22203F}
.btn.primary:hover,.btn.yellow:hover{background:var(--yellow-2)}
.btn.red{background:var(--red);color:#fff}.btn.red:hover{background:var(--red-2)}
.btn.blue{background:var(--blue);color:#fff}
.btn.violet{background:var(--violet);border-color:var(--edge);color:#fff}
.btn.on{background:var(--violet);color:#fff;border-color:var(--edge)}
.btn.sm{min-height:38px;border-width:2px;box-shadow:0 3px 0 var(--edge);margin-bottom:3px}
.btn.sm.ghost{box-shadow:none;margin-bottom:0}
.btn[disabled]{opacity:.35}
.shutter{width:72px;height:72px;background:var(--red);border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);color:#fff;margin:0 10px 5px;transition:transform .08s,box-shadow .08s}
.shutter:hover{background:var(--red-2)}
.shutter:active{transform:translateY(5px);box-shadow:0 0 0 var(--edge)}
.shutter .ico{width:32px;height:32px;stroke-width:2.4}
.shutter.rec{background:var(--red);box-shadow:0 5px 0 var(--edge)}
.s-top{border-bottom:2.5px solid var(--edge)}
.bar{border-top:2.5px solid var(--edge)}
.strip-wrap{border-top:2.5px solid var(--edge);background:var(--soft)}
.cell{border-width:2.5px}.cell.sel{border-color:var(--red)}
.cell.live{border:2.5px dashed var(--muted)}
.counter{font-weight:600}
.pill-btn b{font-size:16px}.pill-btn small{font-size:11px;color:inherit;opacity:.7;margin-left:-4px}
.stepseg{border:2.5px solid var(--edge);border-radius:14px;background:var(--soft)}
.stepseg button.on{background:var(--yellow);color:#22203F;box-shadow:none}
.seg{border:2px solid var(--edge);background:var(--soft)}
.seg button.on{background:var(--yellow);color:#22203F;box-shadow:none}
.chip{border:2px solid var(--edge)}
.chip.on{background:var(--violet);border-color:var(--edge);color:#fff}
.tile{border:2.5px solid var(--edge);border-radius:14px}
.tile.on{border-color:var(--red);box-shadow:0 0 0 3px var(--red)}
.switch span{border:2px solid var(--edge)}
.switch span::after{top:2px;left:2px}
.switch input:checked+span{background:var(--blue)}
.key{border:2.5px solid var(--edge)}
.kn{border:2px solid var(--edge)}
.pcard,.list,.idea,.setgroup,.learn details,.mbox,.ocard,.fxitem,.card,.empty{border:2.5px solid var(--edge)!important}
.pcard,.list,.idea,.setgroup,.learn details{box-shadow:0 5px 0 var(--edge)}
.mbox{box-shadow:0 8px 0 var(--edge)}
.ocard.on{background:var(--soft);border-color:var(--edge);box-shadow:0 0 0 3px var(--red)}
.ocard.on .shape{color:var(--red)}
.tinput{border:2.5px solid var(--edge)}
.search,select{border:2.5px solid var(--edge)}
.topbar{border-bottom:2.5px solid var(--edge)}
.toast{border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--edge);background:var(--ink);color:var(--bg);display:flex;align-items:center;gap:12px}
.toast .tbtn{border:0;background:var(--yellow);color:#22203F;border-radius:8px;padding:4px 10px;font:inherit;font-weight:600;cursor:pointer}
.hglow{display:none}

/* accueil */
.appicon.logo{width:104px;height:auto;background:none;border-radius:0}
.appicon.logo img{width:104px;height:104px;border-radius:26px;border:3px solid var(--edge);box-shadow:0 5px 0 var(--edge);display:block}
.brand h1{font-size:46px}
.brand h1 span{color:var(--red);text-shadow:3px 3px 0 var(--yellow)}
.home-nav .btn{justify-content:center}
.rthumb{border:2px solid var(--edge)}
.rrow{border-bottom:2px solid var(--line)}

/* panneau en accordéon */
.pbody{padding:0}
.acc{border-bottom:2px solid var(--line)}
.acc>summary{list-style:none;display:flex;align-items:center;gap:12px;padding:14px 16px;cursor:pointer;user-select:none}
.acc>summary::-webkit-details-marker{display:none}
.acc>summary:hover{background:var(--soft)}
.acc>summary:focus-visible{outline:2px solid var(--violet);outline-offset:-2px}
.aic{width:40px;height:40px;border-radius:12px;border:2.5px solid var(--edge);display:grid;place-items:center;flex:none;color:#fff}
.at{flex:1;min-width:0}.at b{display:block;font-weight:600}.at small{display:block;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chev{transition:transform .2s;color:var(--muted)}
.acc[open]>summary .chev{transform:rotate(90deg)}
.accb{padding:2px 16px 20px}
.acc[open]>.accb{animation:accIn .2s ease}
@keyframes accIn{from{opacity:0;transform:translateY(-4px)}}
.subacc{margin-top:18px;border-top:2px solid var(--line);padding-top:6px}
.subacc>summary{list-style:none;display:flex;align-items:center;gap:8px;padding:10px 0;cursor:pointer}
.subacc>summary::-webkit-details-marker{display:none}
.subacc>summary .chev{margin-left:auto}
.subacc[open]>summary .chev{transform:rotate(90deg)}
.film-acts{display:flex;flex-direction:column;gap:8px}
.film-acts .btn{justify-content:flex-start}

/* fenêtres flottantes */
.pop{position:fixed;z-index:120;background:var(--surface);border:2.5px solid var(--edge);border-radius:18px;box-shadow:0 6px 0 var(--edge);padding:14px 16px;width:290px;display:none}
.pop.on{display:block;animation:popIn .14s ease}
@keyframes popIn{from{opacity:0;transform:translateY(6px) scale(.97)}}
.pop h4{margin:0 0 10px;font-size:16px}
.pop .sub{font-size:13px;color:var(--muted);margin:4px 0 0}
.presets{display:grid;grid-template-columns:repeat(6,1fr);gap:5px}
.presets button{min-width:0;border:2px solid var(--edge);border-radius:10px;background:var(--surface);padding:6px 0;font-weight:600;cursor:pointer}
.presets button.on{background:var(--yellow);color:#22203F}
#popMore{padding:8px;width:260px}
.menu-item{display:flex;align-items:center;gap:12px;width:100%;padding:10px;border:0;background:transparent;border-radius:12px;cursor:pointer;font-weight:500;text-align:left;font-size:15px}
.menu-item:hover{background:var(--soft)}
.menu-item .mv{margin-left:auto;color:var(--muted);font-size:14px}
#stageWrap:fullscreen{background:#000}
#stageWrap:fullscreen .stage-box{width:100vw!important;height:100vh!important;max-width:calc(100vh*var(--ar,1.7778));max-height:calc(100vw/var(--ar,1.7778))}
/* ===== v1.6 : studio sur téléphone (vertical = tiroir, horizontal = rail), export vidéo ===== */
#dubPanel .pbody{padding:16px}
#studio .badge,#studio .hint{pointer-events:none}
#studio .m-only,#studio .mlbl,#studio .sheet-head,#studio .sheet-bg{display:none}
.rot-tip{position:absolute;top:10px;left:50%;transform:translateX(-50%);z-index:3;display:flex;align-items:center;gap:8px;background:var(--yellow);color:#22203F;border:2.5px solid var(--edge);border-radius:999px;padding:5px 6px 5px 12px;font-size:13px;font-weight:600;box-shadow:0 3px 0 var(--edge);white-space:nowrap;max-width:calc(100% - 20px)}
.rot-tip span{overflow:hidden;text-overflow:ellipsis}
.rot-tip .ico{width:18px;height:18px;animation:rot 2.4s ease-in-out infinite}
@keyframes rot{0%,30%{transform:rotate(0)}55%,100%{transform:rotate(-90deg)}}
.rot-tip button{border:0;background:transparent;padding:2px;display:grid;place-items:center;cursor:pointer;color:inherit}
.rot-tip button .ico{animation:none;width:16px;height:16px}

/* commun aux deux modes téléphone */
#studio.m-port,#studio.m-land{height:100vh;height:100dvh;min-height:0;overflow:hidden}
#studio.m-port .s-main,#studio.m-land .s-main{flex:1;min-height:0;display:grid;gap:0}
#studio.m-port .s-left,#studio.m-land .s-left,#studio.m-port #shootBar,#studio.m-land #shootBar,#studio.m-port #dubBar,#studio.m-land #dubBar{display:contents}
#studio.m-port .stage-wrap,#studio.m-land .stage-wrap{grid-area:stage;height:auto;min-height:0;flex:none}
#studio.m-port .strip-wrap,#studio.m-land .strip-wrap{grid-area:strip}
#studio.m-port .m-only,#studio.m-land .m-only{display:inline-flex}
#studio.m-port .mlbl,#studio.m-land .mlbl{display:inline}
#studio.m-port .g-nav,#studio.m-port .g-tools,#studio.m-land .g-nav,#studio.m-land .g-tools{display:flex}
#studio.m-port #tPrev,#studio.m-port #tNext,#studio.m-port .g-nav .counter,#studio.m-land #tPrev,#studio.m-land #tNext,#studio.m-land .g-nav .counter{display:none}
#studio.sheet-open .rot-tip{display:none}
#studio.m-port .cell,#studio.m-land .cell{height:50px}
#studio.m-port .cell.land,#studio.m-land .cell.land{width:89px}
#studio.m-port .cell.port,#studio.m-land .cell.port{width:28px}
#studio.m-port .cell.live,#studio.m-land .cell.live{width:50px}
#studio.m-port .strip,#studio.m-land .strip{padding:8px 10px}
#studio.m-port .tool,#studio.m-land .tool{flex-direction:column;justify-content:center;gap:2px;min-height:52px;min-width:0;padding:4px 2px;font-size:11px;line-height:1.1;border-radius:12px;width:auto;white-space:nowrap}
#studio.m-port .tool .ico,#studio.m-land .tool .ico{width:20px;height:20px}
#studio.m-port .tool b,#studio.m-land .tool b{font-size:16px;line-height:1}
#studio.m-port .tool small,#studio.m-land .tool small{margin:0;font-size:11px}
#studio.m-port #tMore,#studio.m-land #tMore{border:2px solid var(--edge);box-shadow:0 3px 0 var(--edge);margin-bottom:3px;background:var(--surface)}
#studio .mtool.on{background:var(--violet);color:#fff}
#studio.m-port .acc[data-acc="film"] .sub,#studio.m-land .acc[data-acc="film"] .sub{display:none}

/* le tiroir des réglages */
#studio.m-port #shootPanel,#studio.m-land #shootPanel{position:fixed;z-index:60;display:flex;flex-direction:column;background:var(--surface);border:2.5px solid var(--edge);transition:transform .3s cubic-bezier(.2,.85,.25,1),visibility .3s;visibility:hidden}
#studio.m-port #shootPanel{left:0;right:0;bottom:0;height:56dvh;border-radius:22px 22px 0 0;border-bottom:0;transform:translateY(105%);box-shadow:0 -6px 0 var(--edge)}
#studio.m-land #shootPanel{top:0;bottom:0;right:0;width:min(400px,58vw);border-radius:22px 0 0 22px;border-right:0;transform:translateX(105%);box-shadow:-6px 0 0 var(--edge)}
#studio.sheet-open #shootPanel{transform:none;visibility:visible}
#studio.m-port .sheet-head,#studio.m-land .sheet-head{display:flex;align-items:center;gap:8px;padding:10px 10px 8px 12px;border-bottom:2px solid var(--line);position:relative;flex:none;touch-action:none}
#studio .stabs{flex:1;display:flex;gap:4px;background:var(--soft);border:2px solid var(--edge);border-radius:14px;padding:3px;min-width:0}
#studio .stab{flex:1;border:0;background:transparent;border-radius:10px;padding:7px 4px;font:inherit;font-size:14px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap;min-width:0;overflow:hidden;text-overflow:ellipsis}
#studio .stab.on{background:var(--yellow);color:#22203F}
#studio.m-port .sheet-head .grab{position:absolute;top:5px;left:50%;transform:translateX(-50%);width:44px;height:5px;border-radius:9px;background:var(--line)}
#studio.m-port .sheet-head{padding-top:16px}
#studio.m-port .pbody,#studio.m-land .pbody{flex:1;overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#studio.m-port .acc,#studio.m-land .acc{border:0}
#studio.m-port .acc>summary,#studio.m-land .acc>summary{display:none}
#studio.m-port .acc:not([open]),#studio.m-land .acc:not([open]){display:none}
#studio.m-port .accb,#studio.m-land .accb{padding:12px 16px 28px;animation:none}
#studio.m-port .sheet-bg,#studio.m-land .sheet-bg{display:block;position:fixed;inset:0;z-index:59;background:rgba(15,13,24,.16);opacity:0;pointer-events:none;transition:opacity .25s}
#studio.sheet-open .sheet-bg{opacity:1;pointer-events:auto}
#studio.sheet-open.m-port .stage-wrap{align-items:flex-start;padding-top:10px}
#studio.sheet-open.m-land .stage-wrap{justify-content:flex-start;padding-left:10px}

/* ---- téléphone à la verticale ---- */
#studio.m-port .s-main{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr) auto auto auto;grid-template-areas:"stage" "bar" "strip" "dpanel"}
#studio.m-port #shootRow,#studio.m-port #dubBar>.bar{grid-area:bar}
#studio.m-port #shootRow{display:grid;grid-template-columns:1fr auto 1fr;grid-template-areas:"nav shut done" "tools tools tools";align-items:center;gap:8px 8px;padding:8px 10px 4px}
#studio.m-port .g-nav{grid-area:nav;justify-self:start;gap:4px}
#studio.m-port #tShoot{grid-area:shut;margin:0 0 5px}
#studio.m-port #tDone{grid-area:done;justify-self:end}
#studio.m-port .g-tools{grid-area:tools;gap:6px;width:100%}
#studio.m-port .g-tools .tool{flex:1 1 0}
#studio.m-port .frame-tools{padding:8px 10px 0;gap:6px;flex-wrap:nowrap}
#studio.m-port .frame-tools .btn{flex:1 1 0;padding:0 4px;font-size:12px;gap:4px;min-width:0}
#studio.m-port .frame-tools .btn .ico{width:16px;height:16px}
#studio.m-port #dubPanel{grid-area:dpanel;border:0;border-top:2.5px solid var(--edge);max-height:34dvh;min-height:0}
#studio.m-port #dubPanel .pbody{overflow-y:auto;padding:12px 16px}
#studio.m-port #dubBar>.bar{padding:10px 12px}

/* ---- téléphone à l'horizontale ---- */
#studio.m-land .s-top{padding:4px 8px;gap:6px}
#studio.m-land .s-top .btn{min-height:38px}
#studio.m-land .pname{font-size:16px;padding:4px 6px}
#studio.m-land .s-main{grid-template-columns:minmax(0,1fr) auto;grid-template-rows:minmax(0,1fr) auto;grid-template-areas:"stage rail" "strip rail"}
#studio.m-land #shootRow{grid-area:rail;width:172px;display:grid;grid-template-columns:1fr;align-content:space-evenly;justify-items:center;gap:6px;padding:6px 8px;border-top:0;border-left:2.5px solid var(--edge);overflow-y:auto}
#studio.m-land .g-nav{gap:6px;justify-content:center}
#studio.m-land #tShoot{margin:0 0 5px}
#studio.m-land .g-tools{display:grid;grid-template-columns:repeat(3,1fr);gap:5px;width:100%}
#studio.m-land .g-tools .tool{min-height:46px;font-size:10.5px;padding:3px 1px;letter-spacing:-.1px}
#studio.m-land #tDone{width:100%;justify-content:center}
#studio.m-land .strip{padding:6px 10px}
#studio.m-land .cell{height:42px}
#studio.m-land .cell.land{width:75px}#studio.m-land .cell.port{width:24px}#studio.m-land .cell.live{width:42px}
#studio.m-land .frame-tools{padding:6px 10px 0}
#studio.m-land .frame-tools .btn span{display:none}
#studio.m-land .frame-tools .btn{width:38px;padding:0}
#studio.m-land #dubBar>.bar{grid-area:strip;padding:6px 10px;gap:10px}
#studio.m-land #dubBar .shutter{width:56px;height:56px}
#studio.m-land #dubPanel{grid-area:rail;width:240px;border:0;border-left:2.5px solid var(--edge);min-height:0}
#studio.m-land #dubPanel .pbody{overflow-y:auto;padding:12px 14px}

/* ---- fenêtre d'export ---- */
.mhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.mhead h3{margin:0}
.xbtn{width:42px!important;min-height:42px!important;border:2.5px solid var(--edge)!important;box-shadow:0 3px 0 var(--edge)!important;background:var(--surface)!important;border-radius:50%!important;margin-bottom:3px!important;flex:none}
.xbtn .ico{width:20px;height:20px;stroke-width:2.6}
.exstage{display:flex;justify-content:center;background:#000;border-radius:12px;border:2.5px solid var(--edge);overflow:hidden;min-height:60px}
#exPreview,#exVid{display:none;max-width:100%;max-height:42vh;margin:0;border-radius:0;background:#000}
#exPreview.on,#exVid.on{display:block}
#mExport .progress{margin-top:12px}
#exMsg{margin:12px 0 4px;font-weight:600;text-align:center;min-height:1.4em}
#exMsg.ok{color:var(--blue)}
#mExport .exopts{margin-top:10px}
#mExport .exopt[disabled]{opacity:.4}
@media (max-height:520px){#exPreview,#exVid{max-height:34vh}#mExport .mbox{padding:14px 18px}#mExport .exopt{min-height:50px}}
@media (prefers-reduced-motion: reduce){.rot-tip .ico{animation:none}#studio.m-port #shootPanel,#studio.m-land #shootPanel{transition:none}}
/* ===== v1.7 ===== */
button,.cell,.tile,.chip,.stab,.menu-item,.shutter{touch-action:manipulation}
#studio{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
#studio input,#studio .pname{-webkit-user-select:text;user-select:text}
.dtile img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;background:#3A3560}
.menu-item .msub{margin-left:auto;border:2px solid var(--edge);border-radius:9px;background:var(--soft);padding:2px 8px;font:inherit;font-size:13px;font-weight:600;cursor:pointer;color:var(--ink)}
.auto-chip{position:absolute;top:10px;right:10px;z-index:3;display:flex;align-items:center;gap:6px;border:2.5px solid var(--edge);border-radius:999px;background:var(--red);color:#fff;font:inherit;font-size:13px;font-weight:700;padding:4px 10px 4px 8px;box-shadow:0 3px 0 var(--edge);cursor:pointer}
.auto-chip .ico{width:16px;height:16px}
.auto-chip .dot{width:8px;height:8px;border-radius:50%;background:#fff;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.25}}
.shutter.auto{animation:autoPulse 1.2s ease-in-out infinite}
@keyframes autoPulse{50%{box-shadow:0 5px 0 var(--edge),0 0 0 8px rgba(255,77,77,.3)}}
.coach{position:fixed;z-index:140;width:min(290px,calc(100vw - 20px));background:var(--yellow);color:#22203F;border:2.5px solid var(--edge);border-radius:18px;box-shadow:0 5px 0 var(--edge);padding:12px 14px 10px;font-weight:600;font-size:15px;line-height:1.35;animation:popIn .2s ease}
.coach::after{content:"";position:absolute;left:calc(var(--ax,50%) - 11px);bottom:-13px;width:20px;height:20px;background:var(--yellow);border-right:2.5px solid var(--edge);border-bottom:2.5px solid var(--edge);transform:rotate(45deg)}
.coach.below::after{bottom:auto;top:-13px;transform:rotate(225deg)}
.coach.side::after{left:auto;right:-13px;bottom:calc(50% - 10px);transform:rotate(-45deg)}
.coach .cacts{display:flex;justify-content:space-between;align-items:center;margin-top:8px}
.coach .cacts button{border:2px solid var(--edge);border-radius:10px;background:#fff;font:inherit;font-size:14px;font-weight:700;padding:4px 12px;cursor:pointer;color:#22203F}
.coach .cacts .cx{border:0;background:transparent;font-weight:600;text-decoration:underline;padding:4px 2px;opacity:.75}
@media (prefers-reduced-motion: reduce){.shutter.auto,.auto-chip .dot{animation:none}}
</style>
</head>

/* ================= OUTILS ================= */
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
function rng(seed){let a=seed>>>0;return function(){a=(a+0x6D2B79F5)>>>0;let q=a;q=Math.imul(q^(q>>>15),q|1);q^=q+Math.imul(q^(q>>>7),q|61);return((q^(q>>>14))>>>0)/4294967296}}
const TAU=Math.PI*2;
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function easeOut(p){return 1-Math.pow(1-p,3)}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function loadImg(src){return new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=src})}
function drawCover(ctx,img,w,h,mirror){const iw=img.videoWidth||img.naturalWidth||img.width,ih=img.videoHeight||img.naturalHeight||img.height;if(!iw||!ih)return;
 const s=Math.max(w/iw,h/ih),dw=iw*s,dh=ih*s;ctx.save();if(mirror){ctx.translate(w,0);ctx.scale(-1,1)}ctx.drawImage(img,(w-dw)/2,(h-dh)/2,dw,dh);ctx.restore()}
function blobToData(b){return new Promise((res,rej)=>{const r=new FileReader();r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(b)})}
function dataToBuf(d){const b=atob(d.split(',')[1]);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u.buffer}

const MEM={projects:new Map(),frames:new Map()};
const DB={db:null,
 open(){return new Promise(res=>{try{const r=indexedDB.open('stopmotion-virtuose',2);r.onupgradeneeded=()=>{const d=r.result;if(!d.objectStoreNames.contains('projects'))d.createObjectStore('projects',{keyPath:'id'});if(!d.objectStoreNames.contains('frames'))d.createObjectStore('frames',{keyPath:'key'});if(!d.objectStoreNames.contains('gallery'))d.createObjectStore('gallery',{keyPath:'id'})};r.onsuccess=()=>{this.db=r.result;res(true)};r.onerror=()=>res(false);r.onblocked=()=>res(false)}catch(e){res(false)}})},
 os(s,m){return this.db.transaction(s,m).objectStore(s)},
 rq(r){return new Promise((res,rej)=>{r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})},
 async put(s,v){if(!this.db){MEM[s].set(v.id||v.key,v);return}return this.rq(this.os(s,'readwrite').put(v))},
 async get(s,k){if(!this.db)return MEM[s].get(k);return this.rq(this.os(s,'readonly').get(k))},
 async all(s){if(!this.db)return[...MEM[s].values()];return this.rq(this.os(s,'readonly').getAll())},
 async del(s,k){if(!this.db){MEM[s].delete(k);return}return this.rq(this.os(s,'readwrite').delete(k))},
 async delPrefix(pre){if(!this.db){for(const k of[...MEM.frames.keys()])if(k.startsWith(pre))MEM.frames.delete(k);return}return this.rq(this.os('frames','readwrite').delete(IDBKeyRange.bound(pre,pre+'\uffff')))},
 async clear(){if(!this.db){MEM.projects.clear();MEM.frames.clear();return}await this.rq(this.os('projects','readwrite').clear());await this.rq(this.os('frames','readwrite').clear())}};

/* ================= EFFETS ================= */
function circle(c,x,y,r,col){c.fillStyle=col;c.beginPath();c.arc(x,y,r,0,TAU);c.fill()}
function star4(c,x,y,r){c.beginPath();for(let i=0;i<8;i++){const a=i*Math.PI/4,rr=i%2?r*.35:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function star5(c,x,y,r,rot){c.beginPath();for(let i=0;i<10;i++){const a=rot+i*Math.PI/5-Math.PI/2,rr=i%2?r*.45:r;c.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr)}c.closePath();c.fill()}
function heart(c,x,y,s){c.beginPath();c.moveTo(x,y+s*.3);c.bezierCurveTo(x,y,x-s*.5,y,x-s*.5,y+s*.3);c.bezierCurveTo(x-s*.5,y+s*.6,x,y+s*.8,x,y+s);c.bezierCurveTo(x,y+s*.8,x+s*.5,y+s*.6,x+s*.5,y+s*.3);c.bezierCurveTo(x+s*.5,y,x,y,x,y+s*.3);c.fill()}
function comic(c,p,txt,fill,inner,textCol){const pop=p<.3?easeOut(p/.3)*1.15:1.15-.15*Math.min(1,(p-.3)/.2);c.globalAlpha=p>.8?1-(p-.8)/.2:1;c.save();c.rotate(-.12);c.scale(pop,pop);
 c.beginPath();for(let i=0;i<28;i++){const a=i/28*TAU,r=i%2?95:150+((i*37)%5)*8;c.lineTo(Math.cos(a)*r*1.25,Math.sin(a)*r*.85)}c.closePath();c.fillStyle=fill;c.fill();c.lineWidth=7;c.strokeStyle='#1F1D2B';c.stroke();
 c.beginPath();for(let i=0;i<20;i++){const a=i/20*TAU,r=i%2?62:95;c.lineTo(Math.cos(a)*r*1.25,Math.sin(a)*r*.8)}c.closePath();c.fillStyle=inner;c.fill();
 c.font='700 70px Fredoka, "Arial Rounded MT Bold", "Arial Black", sans-serif';c.textAlign='center';c.textBaseline='middle';c.lineJoin='round';c.lineWidth=12;c.strokeStyle='#1F1D2B';c.strokeText(txt,0,4);c.fillStyle=textCol;c.fillText(txt,0,4);c.restore();c.globalAlpha=1}
const PAL_FIRE=['255,255,225','255,210,63','255,110,26','200,30,20','#2B2230','#FF9B2F'];
const PAL_BLUE=['240,250,255','127,227,255','70,120,255','60,30,200','#1E1B4B','#9FE8FF'];
function boom(c,p,seed,pal,size){const r=rng(seed);const S=size||1;
 if(p<.35){const R0=(80+p*500)*S,g=c.createRadialGradient(0,0,0,0,0,R0);g.addColorStop(0,`rgba(${pal[0]},${.9-p*2.4})`);g.addColorStop(1,`rgba(${pal[0]},0)`);c.fillStyle=g;c.beginPath();c.arc(0,0,R0,0,TAU);c.fill()}
 if(p>.3&&pal===PAL_FIRE){for(let i=0;i<9;i++){const a=r()*TAU,d=(40+r()*90*p)*S,rad=(40+r()*50)*(.6+p)*S;c.globalAlpha=Math.max(0,(p-.3)*1.6*(1-p));circle(c,Math.cos(a)*d,Math.sin(a)*d-p*60*S,rad,i%2?'#55525E':'#77737F')}c.globalAlpha=1}
 const R=(50+easeOut(p)*170)*S,al=Math.max(0,1-p*p*1.1);const g=c.createRadialGradient(0,0,0,0,0,R);g.addColorStop(0,`rgba(${pal[0]},${al})`);g.addColorStop(.3,`rgba(${pal[1]},${al})`);g.addColorStop(.6,`rgba(${pal[2]},${al})`);g.addColorStop(.85,`rgba(${pal[3]},${al*.8})`);g.addColorStop(1,`rgba(${pal[3]},0)`);
 c.fillStyle=g;c.beginPath();for(let i=0;i<=24;i++){const a=i/24*TAU,rr=R*(.82+.18*Math.sin(i*2.7+seed));c.lineTo(Math.cos(a)*rr,Math.sin(a)*rr)}c.fill();
 const r2=rng(seed+9);for(let i=0;i<22;i++){const a=r2()*TAU,s=.5+r2(),d=easeOut(p)*300*s*S;c.save();c.translate(Math.cos(a)*d,Math.sin(a)*d+p*p*80);c.rotate(p*8*s);c.globalAlpha=1-p;c.fillStyle=i%3?pal[4]:pal[5];c.fillRect(-5,-5,10*s+4,8);c.restore()}c.globalAlpha=1}
function ring(c,R,w,col){c.strokeStyle=col;c.lineWidth=w;c.beginPath();c.arc(0,0,R,0,TAU);c.stroke()}

/* ---------- Incrustation ---------- */
function keyOn(){return ST.p.chroma.on&&!ST.picking}
function keyPixels(d,ch){const kr=ch.color[0],kg=ch.color[1],kb=ch.color[2];const kcb=-.169*kr-.331*kg+.5*kb,kcr=.5*kr-.419*kg-.081*kb;const tol=ch.tol*1.2,soft=Math.max(1,ch.soft*1.2);const dom=(kg>=kr&&kg>=kb)?1:(kb>=kr?2:0);
 for(let i=0;i<d.length;i+=4){const r=d[i],g=d[i+1],b=d[i+2];const cb=-.169*r-.331*g+.5*b-kcb,cr=.5*r-.419*g-.081*b-kcr;const dist=Math.sqrt(cb*cb+cr*cr);const a=dist<=tol?0:dist>=tol+soft?1:(dist-tol)/soft;
  if(a===0){d[i+3]=0;continue}if(ch.spill){if(dom===1){const m=r>b?r:b;if(g>m)d[i+1]=m}else if(dom===2){const m=r>g?r:g;if(b>m)d[i+2]=m}else{const m=g>b?g:b;if(r>m)d[i]=m}}d[i+3]=d[i+3]*a}}
function makeKeyed(img,target){const c=target||document.createElement('canvas');if(c.width!==W||c.height!==H){c.width=W;c.height=H}const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,W,H);x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H);keyPixels(d.data,ST.p.chroma);x.putImageData(d,0,0);return c}
function keyedFrame(f){const e=ST.keyCache.get(f.id);if(e&&e.v===ST.keyVer){ST.keyCache.delete(f.id);ST.keyCache.set(f.id,e);return e.c}
 let reuse=e&&e.c;if(!reuse&&ST.keyCache.size>=40){const k=ST.keyCache.keys().next().value;reuse=ST.keyCache.get(k).c;ST.keyCache.delete(k)}
 const c=makeKeyed(f.img,reuse);ST.keyCache.delete(f.id);ST.keyCache.set(f.id,{v:ST.keyVer,c});return c}
function layerFor(i){const f=ST.frames[i];if(!f)return null;return keyOn()?keyedFrame(f):f.img}

/* ---------- Composition ---------- */
function drawBackground(c,idx){const b=ST.p.bg;if(b.kind==='image'&&ST.bgImg)drawCover(c,ST.bgImg,W,H,false);
 else drawChecker(c)}
function fxEnv(e){const ox=e.x*W,oy=e.y*H,s=e.scale;return{ox,oy,s,env:{left:-ox/s,right:(W-ox)/s,top:-oy/s,bottom:(H-oy)/s}}}
function drawFxInstance(c,e,k){const fx=FX[e.type];if(!fx||k<0||k>=fx.dur)return;const p=fx.dur>1?k/(fx.dur-1):1;c.save();if(fx.full)fx.draw(c,p,k,e.seed);else{const q=fxEnv(e);c.translate(q.ox,q.oy);c.scale(q.s,q.s);fx.draw(c,p,k,e.seed,q.env)}c.restore()}
function shakeAt(idx){for(const e of ST.p.effects){if(e.type!=='tremble')continue;const k=idx-e.start;if(k>=0&&k<FX.tremble.dur){const a=20*(1-k/FX.tremble.dur);return{x:Math.sin(k*7.3+e.seed)*a,y:Math.cos(k*5.1+e.seed)*a}}}return null}
function compose(c,layer,idx){c.save();c.clearRect(0,0,W,H);const sh=shakeAt(idx);if(sh){c.fillStyle='#000';c.fillRect(0,0,W,H);c.translate(W/2+sh.x,H/2+sh.y);c.scale(1.06,1.06);c.translate(-W/2,-H/2)}
 if(keyOn())drawBackground(c,idx);else{c.fillStyle='#000';c.fillRect(0,0,W,H)}if(layer)c.drawImage(layer,0,0,W,H);
 for(const e of ST.p.effects){const fx=FX[e.type];if(fx&&fx.full)continue;drawFxInstance(c,e,idx-e.start)}c.restore();
 for(const e of ST.p.effects){const fx=FX[e.type];if(fx&&fx.full)drawFxInstance(c,e,idx-e.start)}}
function drawOnion(c,before){const n=SET.onionN;for(let j=n;j>=1;j--){const i=before-j;if(i<0)continue;c.globalAlpha=(SET.onionA/100)*(1-(j-1)/(n+.5));c.drawImage(layerFor(i),0,0,W,H)}c.globalAlpha=1}
function drawOverlays(){if(ST.grid){sctx.strokeStyle='rgba(255,255,255,.5)';sctx.lineWidth=1.5;sctx.beginPath();for(const f of[1/3,2/3]){sctx.moveTo(W*f,0);sctx.lineTo(W*f,H);sctx.moveTo(0,H*f);sctx.lineTo(W,H*f)}sctx.stroke()}
 const e=ST.p.effects.find(x=>x.id===ST.selFx);if(e&&!FX[e.type].full){sctx.save();sctx.setLineDash([8,7]);sctx.lineWidth=2.5;sctx.strokeStyle='#FFD43B';sctx.beginPath();sctx.arc(e.x*W,e.y*H,70*e.scale,0,TAU);sctx.stroke();sctx.restore();circle(sctx,e.x*W,e.y*H,6,'#FFD43B')}}
function mirrorOn(){return SET.mirror&&ST.facing==='user'}
function camReady(){return ST.camState==='on'&&video.readyState>=2}
function renderLive(){drawCover(srcX,video,W,H,mirrorOn());const layer=keyOn()?makeKeyed(srcC,liveKeyC):srcC;compose(sctx,layer,ST.frames.length);if(ST.onion&&!ST.picking)drawOnion(sctx,ST.frames.length);drawOverlays()}
function renderFrame(i,onion){compose(sctx,layerFor(i),i);if(onion!==false&&ST.onion&&!ST.playing&&!ST.picking)drawOnion(sctx,i);if(!ST.playing)drawOverlays()}
function refresh(){if(!ST.p||ST.playing||ST.step!=='shoot')return;if(ST.mode==='frame'&&ST.cur>=0)renderFrame(ST.cur);else if(camReady())renderLive();else{compose(sctx,null,ST.frames.length);drawOverlays()}}
function loop(){if(!ST.active)return;ST.raf=requestAnimationFrame(loop);if(ST.step!=='shoot'||ST.mode!=='live'||ST.playing||!camReady())return;const now=performance.now();if(now-ST.lastLive<(keyOn()?55:33))return;ST.lastLive=now;renderLive()}

/* ---------- Caméra ---------- */
async function startCamera(){if(!ST.active||ST.step!=='shoot')return;stopCamera();ST.camState='starting';updateUI();
 if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){camFail('camNo');return}
 const land=W>=H,want={facingMode:ST.facing,width:{ideal:land?1280:720},height:{ideal:land?720:1280}};
 try{let s;try{s=await navigator.mediaDevices.getUserMedia({video:want,audio:false})}catch(e){if(e&&(e.name==='OverconstrainedError'||e.name==='NotReadableError'||e.name==='AbortError'))s=await navigator.mediaDevices.getUserMedia({video:true,audio:false});else throw e}
  if(!ST.active||ST.step!=='shoot'){s.getTracks().forEach(tr=>tr.stop());return}
  ST.stream=s;video.srcObject=s;video.play().catch(()=>{});
  await new Promise(r=>{if(video.readyState>=2)return r();const done=()=>{video.removeEventListener('loadeddata',done);r()};video.addEventListener('loadeddata',done);setTimeout(done,4000)});
  ST.camState=video.readyState>=2?'on':'fail';if(ST.camState==='fail'){camFail('camNo');return}updateUI()}
 catch(e){camFail(e&&e.name==='NotFoundError'?'camNoDevice':'camNo')}}
function camFail(k){stopCamera();ST.camState='fail';ST.camMsg=k;if(ST.frames.length&&ST.mode==='live')selectFrame(ST.frames.length-1);updateUI()}
function stopCamera(){if(ST.stream){ST.stream.getTracks().forEach(tr=>tr.stop());ST.stream=null}video.srcObject=null;if(ST.camState==='on'||ST.camState==='starting')ST.camState='off'}

/* ---------- Sons ---------- */
let AC=null;function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume().catch(()=>{});return AC}
function shutterSound(){if(!SET.sound)return;const a=ac();if(!a)return;const len=a.sampleRate*.08,b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.pow(1-i/len,3);const s=a.createBufferSource();s.buffer=b;const g=a.createGain();g.gain.value=.4;s.connect(g).connect(a.destination);s.start()}
function beep(f){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.frequency.value=f||660;g.gain.setValueAtTime(.15,a.currentTime);g.gain.exponentialRampToValueAtTime(.001,a.currentTime+.15);o.connect(g).connect(a.destination);o.start();o.stop(a.currentTime+.16)}

function renderStrip(){const s=$('#strip');s.innerHTML='';const starts=new Set(ST.p.effects.map(e=>e.start));const cls=W>H?'land':'port';

 const l=document.createElement('button');l.className='cell live';l.dataset.i=-1;l.setAttribute('aria-label',t('live'));l.innerHTML=`<svg class="ico"><use href="#i-cam"/></svg>`;l.onclick=goLive;s.appendChild(l);updateUI();syncOpts()}

function play(){const n=ST.frames.length;if(!n){toast(t('noFrames'));return}ST.playing=true;let i=ST.mode==='frame'&&ST.cur<n-1?ST.cur:0;updateUI();
 const step=()=>{if(!ST.playing)return;renderFrame(i,false);$$('#strip .cell').forEach(el=>el.classList.toggle('playing',+el.dataset.i===i));$('#counter').textContent=(i+1)+' / '+n;
  i++;if(i>=n){if(ST.p.loop)i=0;else{ST.playTimer=setTimeout(()=>{stopPlay();selectFrame(n-1)},1000/ST.p.fps);return}}ST.playTimer=setTimeout(step,1000/ST.p.fps)};step()}

async function addFrames(datas){const p=ST.p;for(const data of datas){const id=uid();const img=await loadImg(data);ST.frames.push({id,img});p.frameIds.push(id);try{await DB.put('frames',{key:p.id+':'+id,data})}catch(e){toast(t('noStorage'))}}scheduleSave();renderStrip()}
async function shoot(){if(ST.playing)stopPlay();if(ST.busy)return;

const KEY_DEF={tol:22,soft:20,clean:10,choke:1,spill:50};
MEM.gallery=new Map();
DB.clear=async function(){if(!this.db){MEM.projects.clear();MEM.frames.clear();MEM.gallery.clear();return}for(const s of['projects','frames','gallery'])await this.rq(this.os(s,'readwrite').clear())};
function migrateChroma(ch){ch=ch||{};if(!Array.isArray(ch.colors)){ch.colors=ch.color?[ch.color]:[];delete ch.color;ch.tol=KEY_DEF.tol;ch.soft=KEY_DEF.soft}
 if(typeof ch.spill!=='number')ch.spill=ch.spill===false?0:KEY_DEF.spill;for(const k in KEY_DEF)if(typeof ch[k]!=='number')ch[k]=KEY_DEF[k];
 if(!ch.fit)ch.fit='cover';if(!ch.zoom)ch.zoom=100;if(!ch.colors.length)ch.on=false;ST.view='result';return ch}

/* --- Incrustation façon logiciel de montage ---
   On compare la TEINTE de chaque pixel à celle de la couleur prélevée, et on exige une saturation suffisante.
   Toutes les nuances du fond (zones claires ou dans l'ombre) disparaissent ; le blanc, le gris, le noir
   et les autres couleurs ne sont jamais touchés. Couleur prélevée peu saturée (mur blanc, gris) : distance RGB. */
function smooth(a,b,x){if(b<=a)return x<a?0:1;const q=clamp((x-a)/(b-a),0,1);return q*q*(3-2*q)}
function hsvInto(r,g,b,o){const mx=r>g?(r>b?r:b):(g>b?g:b),mn=r<g?(r<b?r:b):(g<b?g:b),c=mx-mn;let h=0;if(c){if(mx===r)h=((g-b)/c)%6;else if(mx===g)h=(b-r)/c+2;else h=(r-g)/c+4;h*=60;if(h<0)h+=360}o[0]=h;o[1]=mx?c/mx:0;o[2]=mx/255}
let KA=null,KT=null;
function erode(A,T,w,h){for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){let m=A[r+x];if(x>0&&A[r+x-1]<m)m=A[r+x-1];if(x<w-1&&A[r+x+1]<m)m=A[r+x+1];T[r+x]=m}}
 for(let y=0;y<h;y++){const r=y*w;for(let x=0;x<w;x++){let m=T[r+x];if(y>0&&T[r-w+x]<m)m=T[r-w+x];if(y<h-1&&T[r+w+x]<m)m=T[r+w+x];A[r+x]=m}}}
function keyImageData(img){const d=img.data,ch=ST.p.chroma,n=d.length>>2,o=[0,0,0];
 const keys=ch.colors.map(c=>{hsvInto(c[0],c[1],c[2],o);return{r:c[0],g:c[1],b:c[2],h:o[0],s:o[1],hue:o[1]>=.18}});
 const tolD=4+ch.tol*.8,softD=2+ch.soft*.6,spillD=tolD+softD+18,cl=ch.clean/100*.45,spill=ch.spill/100;
 if(!KA||KA.length!==n){KA=new Float32Array(n);KT=new Float32Array(n)}
 for(let i=0,p=0;i<n;i++,p+=4){const r=d[p],g=d[p+1],b=d[p+2];hsvInto(r,g,b,o);let k=0,sk=0;
  for(let j=0;j<keys.length;j++){const K=keys[j];let kk;
   if(K.hue){let dh=Math.abs(o[0]-K.h);if(dh>180)dh=360-dh;const sm=K.s*.4;
    kk=(1-smooth(tolD,tolD+softD,dh))*smooth(sm*.5,sm,o[1])*smooth(.05,.13,o[2]);
    const s2=(1-smooth(tolD,spillD,dh))*smooth(.04,.25,o[1]);if(s2>sk)sk=s2}
   else{const dr=r-K.r,dg=g-K.g,db=b-K.b,dist=Math.sqrt(dr*dr+dg*dg+db*db)/441.7,t0=ch.tol/400;kk=1-smooth(t0,t0+ch.soft/300+.005,dist)}
   if(kk>k)k=kk}
  let a=1-k;if(cl>0)a=clamp((a-cl)/(1-2*cl),0,1);KA[i]=a;
  if(spill>0&&sk>0&&a>0){const amt=sk*spill,l=.299*r+.587*g+.114*b;d[p]=r+(l-r)*amt;d[p+1]=g+(l-g)*amt;d[p+2]=b+(l-b)*amt}}
 for(let s=0;s<ch.choke;s++)erode(KA,KT,W,H);
 for(let i=0,p=3;i<n;i++,p+=4)d[p]=d[p]*KA[i]}
function makeKeyed(img,target){const c=target||document.createElement('canvas');if(c.width!==W||c.height!==H){c.width=W;c.height=H}const x=c.getContext('2d',{willReadFrequently:true});x.clearRect(0,0,W,H);x.drawImage(img,0,0,W,H);const d=x.getImageData(0,0,W,H);keyImageData(d);x.putImageData(d,0,0);return c}
function keyOn(){const ch=ST.p.chroma;return ch.on&&ch.colors.length>0&&!ST.picking&&ST.view!=='original'}

/* --- Composition : décor dessous, sujet détouré dessus --- */
const matteC=document.createElement('canvas');
function drawBackground(c,idx){const b=ST.p.bg,ch=ST.p.chroma,z=(ch.zoom||100)/100,cont=ch.fit==='contain';c.fillStyle='#000';c.fillRect(0,0,W,H);
 if(b.kind==='image'&&ST.bgImg){const iw=ST.bgImg.naturalWidth,ih=ST.bgImg.naturalHeight,s=(cont?Math.min(W/iw,H/ih):Math.max(W/iw,H/ih))*z;c.drawImage(ST.bgImg,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s)}
 else if(b.kind==='preset'&&decorImg(b.id)&&DIMG[b.id].naturalWidth){const im=DIMG[b.id],iw=im.naturalWidth,ih=im.naturalHeight,s=(cont?Math.min(W/iw,H/ih):Math.max(W/iw,H/ih))*z;c.drawImage(im,(W-iw*s)/2,(H-ih*s)/2,iw*s,ih*s)}
 else if(b.kind==='preset'){c.fillStyle='#3A3560';c.fillRect(0,0,W,H)}
 else drawChecker(c)}
function compose(c,layer,idx){
 if(c===sctx&&ST.view==='matte'&&keyOn()){c.save();c.fillStyle='#000';c.fillRect(0,0,W,H);if(layer){if(matteC.width!==W||matteC.height!==H){matteC.width=W;matteC.height=H}const m=matteC.getContext('2d');m.globalCompositeOperation='source-over';m.clearRect(0,0,W,H);m.drawImage(layer,0,0,W,H);m.globalCompositeOperation='source-in';m.fillStyle='#fff';m.fillRect(0,0,W,H);m.globalCompositeOperation='source-over';c.drawImage(matteC,0,0)}c.restore();return}
 c.save();c.clearRect(0,0,W,H);const sh=shakeAt(idx);if(sh){c.fillStyle='#000';c.fillRect(0,0,W,H);c.translate(W/2+sh.x,H/2+sh.y);c.scale(1.06,1.06);c.translate(-W/2,-H/2)}
 if(keyOn())drawBackground(c,idx);else{c.fillStyle='#000';c.fillRect(0,0,W,H)}if(layer)c.drawImage(layer,0,0,W,H);
 for(const e of ST.p.effects){const fx=FX[e.type];if(fx&&fx.full)continue;drawFxInstance(c,e,idx-e.start)}c.restore();
 for(const e of ST.p.effects){const fx=FX[e.type];if(fx&&fx.full)drawFxInstance(c,e,idx-e.start)}}
function drawOnion(c,before){if(ST.view==='matte'&&keyOn())return;const n=SET.onionN;for(let j=n;j>=1;j--){const i=before-j;if(i<0)continue;c.globalAlpha=(SET.onionA/100)*(1-(j-1)/(n+.5));c.drawImage(layerFor(i),0,0,W,H)}c.globalAlpha=1}

function syncChroma(){const ch=ST.p.chroma;$('#cOn').checked=ch.on;const K=$('#cKeys');K.innerHTML='';
 if(!ch.colors.length)K.innerHTML=`<div class="empty-k">${esc(t('noKey'))}</div>`;
 ch.colors.forEach((col,i)=>{const s=document.createElement('div');s.className='key';s.style.background=rgbHex(col);s.title=rgbHex(col);const x=document.createElement('button');x.textContent='×';x.setAttribute('aria-label',t('delete'));x.onclick=()=>{ch.colors.splice(i,1);if(!ch.colors.length)ch.on=false;chromaChanged()};s.appendChild(x);K.appendChild(s)});
 $('#cPickAdd').disabled=!ch.colors.length||ch.colors.length>=4;
 for(const [id,k,f] of [['cTol','tol'],['cSoft','soft'],['cClean','clean'],['cChoke','choke',v=>v+' px'],['cSpill','spill',v=>v+' %']]){$('#'+id).value=ch[k];$('#'+id+'V').textContent=f?f(ch[k]):ch[k]}
 $('#cZoom').value=ch.zoom;$('#cZoomV').textContent=ch.zoom+' %';
 $$('#cFit button').forEach(b=>b.classList.toggle('on',b.dataset.v===ch.fit));$$('#cView button').forEach(b=>b.classList.toggle('on',b.dataset.v===ST.view))}
function setPicking(on,add){ST.picking=on;ST.pickAdd=!!(on&&add);ST.aiming=false;if(on)setPlacing(null);stage.classList.toggle('picking',on);
 $('#cPick').classList.toggle('on',on&&!add);$('#cPick').classList.toggle('violet',!(on&&!add));$('#cPickAdd').classList.toggle('on',on&&!!add);
 hint(on?t('pickHint'):'');if(on&&ST.playing)stopPlay();refresh()}
function enableKeyIfReady(){const ch=ST.p.chroma;if(ch.colors.length){if(!ch.on){ch.on=true;ST.keyVer++;syncChroma()}}else toast(t('pickFirst'))}
async function buildBgTiles(){const box=$('#bgTiles');box.innerHTML='';$$('#bgChips [data-g]').forEach(c=>c.classList.toggle('on',c.dataset.g===ST.bgGroup));
 if(ST.bgGroup==='mine'){const add=document.createElement('button');add.className='tile addtile';add.innerHTML=`<span class="addin"><svg class="ico"><use href="#i-plus"/></svg>${esc(t('addFromGallery'))}</span>`;add.onclick=()=>$('#fileBg').click();box.appendChild(add);
  let items=[];try{items=(await DB.all('gallery')).sort((a,b)=>b.ts-a.ts)}catch(e){}
  for(const it of items){const b=document.createElement('div');b.className='tile gtile';b.dataset.gid=it.id;b.tabIndex=0;b.setAttribute('role','button');
   b.innerHTML=`<img alt="" src="${it.data}"><button class="gdel" aria-label="${esc(t('delete'))}">×</button>`;

   b.onkeydown=ev=>{if(ev.key==='Enter')useGallery(it)};box.appendChild(b)}}

/* --- son de prise de photo : petit déclic d'obturateur, discret --- */
function shutterSound(){if(!SET.sound)return;const a=ac();if(!a)return;const t0=a.currentTime+.005;
 const click=(at,dur,freq,vol)=>{const len=Math.max(1,Math.floor(a.sampleRate*dur)),b=a.createBuffer(1,len,a.sampleRate),d=b.getChannelData(0);
  for(let i=0;i<len;i++)d[i]=(Math.random()*2-1)*Math.exp(-i/(len*.16));
  const s=a.createBufferSource();s.buffer=b;const f=a.createBiquadFilter();f.type='bandpass';f.frequency.value=freq;f.Q.value=1.4;const g=a.createGain();g.gain.value=vol;s.connect(f).connect(g).connect(a.destination);s.start(at)};
 click(t0,.022,3400,.32);click(t0+.065,.03,2300,.22);
 const o=a.createOscillator(),g=a.createGain();o.type='sine';o.frequency.setValueAtTime(170,t0);o.frequency.exponentialRampToValueAtTime(80,t0+.05);
 g.gain.setValueAtTime(.05,t0);g.gain.exponentialRampToValueAtTime(.0001,t0+.06);o.connect(g).connect(a.destination);o.start(t0);o.stop(t0+.07)}

async function buildSoundtrack(p,n){const wantFx=SET.sfx&&p.effects.some(e=>e.start<n&&SFX_OF[e.type]);if(!ST.voice&&!wantFx)return null;
 const sr=44100,dur=n/p.fps+1.6,oc=new(window.OfflineAudioContext||window.webkitOfflineAudioContext)(2,Math.ceil(sr*dur),sr);
 if(ST.voice){try{const buf=await oc.decodeAudioData(dataToBuf(ST.voice.data));const s=oc.createBufferSource();s.buffer=buf;s.connect(oc.destination);s.start(0)}catch(e){}}
 if(wantFx){const g=oc.createGain();g.gain.value=.6;g.connect(oc.destination);for(const e of p.effects)if(e.start<n&&SFX_OF[e.type])try{playSfx(oc,SFX_OF[e.type],e.start/p.fps+.001,g)}catch(err){}}
 return await oc.startRendering()}
function exportSig(){const p=ST.p;return JSON.stringify([p.id,p.frameIds,p.effects,p.chroma,p.bg.kind,p.bg.id||'',p.bg.gid||'',p.fps,p.orient,p.name,ST.voice?ST.voice.dur+':'+ST.voice.data.length:0,LANG,SET.sfx])}
async function buildVideo(){const p=ST.p,n=ST.frames.length;
 EX.abort=false;EX.running=true;ST.busy=true;exView('canvas');exMsg(t('recordingVideo'));exProg(0);
 if(p.bg&&p.bg.kind==='preset')await decorReady(p.bg.id);
 let track=null;try{track=await buildSoundtrack(p,n)}catch(e){track=null}
 const withA=!!track;const types=withA?['video/mp4;codecs=avc1,mp4a.40.2','video/mp4','video/webm;codecs=vp9,opus','video/webm;codecs=vp8,opus','video/webm']:['video/mp4;codecs=avc1','video/mp4','video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'];
 const mime=window.MediaRecorder&&MediaRecorder.isTypeSupported?types.find(m=>MediaRecorder.isTypeSupported(m)):null;
 if(!mime||!exC.captureStream){EX.running=false;ST.busy=false;exView(null);exProg(null);exMsg(t('noVideoExport'));return}
 const sig=exportSig();let src=null,stream=null,rec=null;
 const draw=i=>{ST.outMode=true;try{compose(exX,layerFor(i),i)}finally{ST.outMode=false}};
 try{draw(0);stream=exC.captureStream(p.fps);
  if(withA){try{const a=ac();await a.resume();const dest=a.createMediaStreamDestination();src=a.createBufferSource();src.buffer=track;src.connect(dest);stream=new MediaStream([...stream.getVideoTracks(),...dest.stream.getAudioTracks()])}catch(e){src=null}}
  rec=new MediaRecorder(stream,{mimeType:mime,videoBitsPerSecond:6e6});const chunks=[];rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};const stopped=new Promise(r=>rec.onstop=r);
  rec.start(250);if(src)src.start();const dt=1000/p.fps,t0=performance.now();
  for(let i=0;i<n&&!EX.abort;i++){draw(i);exProg((i+1)/n);const w=t0+(i+1)*dt-performance.now();if(w>0)await sleep(w)}
  if(!EX.abort){const tail=Math.max(dt,Math.min(1200,(track?track.duration*1000:0)-(performance.now()-t0)));await sleep(tail)}
  if(src){try{src.stop()}catch(e){}}rec.stop();await stopped;stream.getTracks().forEach(tr=>tr.stop());
  if(!EX.abort&&ST.p===p){EX.blob=new Blob(chunks,{type:mime.split(';')[0]});EX.ext=mime.includes('mp4')?'mp4':'webm';EX.sig=sig;if($('#mExport').classList.contains('on'))exReady()}}
 catch(e){try{rec&&rec.state!=='inactive'&&rec.stop()}catch(_){}try{stream&&stream.getTracks().forEach(tr=>tr.stop())}catch(_){}if(!EX.abort)exMsg(t('exportFail'))}
 EX.running=false;ST.busy=false;exProg(null)}
const _openExport17=openExport;openExport=function(){autoStop(true);_openExport17();const sub=$('#exDownloadSub');if(sub&&SET.sfx&&ST.p&&ST.p.effects.length&&!ST.voice)sub.textContent=LANG==='fr'?'Avec le fond vert, les effets et leurs sons':'With green screen, effects and their sounds'};

/* --- écran toujours allumé pendant le tournage --- */
let WL=null;async function wakeOn(){try{if('wakeLock'in navigator&&!WL&&document.visibilityState==='visible'&&current==='studio'){WL=await navigator.wakeLock.request('screen');WL.addEventListener('release',()=>{WL=null})}}catch(e){}}
function wakeOff(){try{WL&&WL.release()}catch(e){}WL=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')wakeOn();else autoStop(true)});

/* --- photo automatique --- */
const AUTO={on:false,sec:3,next:0,lastTick:-1};
function autoReady(){return ST.active&&ST.step==='shoot'&&ST.mode==='live'&&camReady()&&!ST.playing&&!ST.busy&&!ST.picking&&!ST.placing&&!M.sheet&&!$('.modal.on')}
function autoStart(sec){AUTO.on=true;AUTO.sec=sec;SET.autoSec=sec;saveSettings();AUTO.next=performance.now()+sec*1000;AUTO.lastTick=-1;closePops();if(ST.mode!=='live')goLive();toast(t('autoOn',{s:sec}));autoUI()}
function autoStop(quiet){if(!AUTO.on)return;AUTO.on=false;autoUI();if(!quiet)toast(t('autoOff'))}
function autoUI(){const chip=$('#autoChip'),sh=$('#tShoot');chip.hidden=!AUTO.on;sh.classList.toggle('auto',AUTO.on);$('#tAutoV').textContent=AUTO.on?AUTO.sec+' s':'—'}
setInterval(async()=>{if(!AUTO.on)return;if(!ST.active||ST.step!=='shoot'){autoStop(true);return}
 if(!autoReady()){AUTO.next=Math.max(AUTO.next,performance.now()+1000);return}
 const left=Math.ceil((AUTO.next-performance.now())/1000);$('#autoChipTx').textContent=t('autoChip',{s:Math.max(0,left)});
 if(left===1&&AUTO.lastTick!==1&&SET.sound){beep(1046);AUTO.lastTick=1}
 if(performance.now()>=AUTO.next){AUTO.lastTick=-1;AUTO.next=performance.now()+AUTO.sec*1000;const tm=SET.timer;SET.timer=0;try{await shoot()}finally{SET.timer=tm}}},200);
$('#tAuto').onclick=()=>{if(AUTO.on){autoStop();closePops();return}const opts=[2,3,5,10];autoStart(opts.includes(SET.autoSec)?SET.autoSec:3)};
$('#tAutoSec').onclick=e=>{e.stopPropagation();const opts=[2,3,5,10];const i=(opts.indexOf(SET.autoSec)+1)%opts.length;SET.autoSec=opts[i];saveSettings();AUTO.sec=SET.autoSec;$('#tAutoSecV').textContent=SET.autoSec+' s';if(AUTO.on){AUTO.next=performance.now()+AUTO.sec*1000;toast(t('autoOn',{s:AUTO.sec}))}};
$('#autoChip').onclick=()=>autoStop();
$('#tShoot').onclick=()=>{if(AUTO.on){autoStop();return}shoot()};

/* --- bloquer la lumière (contre le scintillement), si l'appareil le permet --- */
function camTrack(){return ST.stream&&ST.stream.getVideoTracks()[0]}
function lockModes(){const tr=camTrack();if(!tr||!tr.getCapabilities)return null;let c;try{c=tr.getCapabilities()}catch(e){return null}const k=[];for(const m of['exposureMode','focusMode','whiteBalanceMode'])if(Array.isArray(c[m])&&c[m].includes('continuous')&&c[m].includes('single-shot'))k.push(m);return k.length?k:null}
async function applyLock(on){const tr=camTrack(),k=lockModes();if(!tr||!k)return false;const adv={};for(const m of k)adv[m]=on?'single-shot':'continuous';try{await tr.applyConstraints({advanced:[adv]});return true}catch(e){return false}}
function lockUI(){const k=lockModes();$('#lockRow').hidden=!k;$('#oLock').checked=!!ST.lightLock}
$('#oLock').onchange=async e=>{ST.lightLock=e.target.checked;const ok=await applyLock(ST.lightLock);if(!ok&&ST.lightLock){ST.lightLock=false;e.target.checked=false}toast(ST.lightLock?t('lightLockOn'):t('lightLockOff'))};
const _startCamera17=startCamera;startCamera=async function(){await _startCamera17();if(ST.camState==='on'){if(ST.lightLock)await applyLock(true);lockUI()}};

/* --- conseils de démarrage --- */
function coachStep(){if(!ST.p||current!=='studio'||ST.step!=='shoot'||M.sheet||$('.modal.on')||ST.playing)return 0;const n=ST.frames.length,s=SET.tips||0;
 if(s<1&&n===0&&ST.camState==='on')return 1;if(s<2&&n>=1&&n<3)return 2;if(s<3&&n>=3)return 3;return 0}
function coachUpdate(){const el=$('#coach');const k=coachStep();if(!k){el.hidden=true;return}
 const anchor=k===3?$('#tPlay'):$('#tShoot');const r=anchor.getBoundingClientRect();if(!r.width){el.hidden=true;return}
 $('#coachTx').textContent=t('coach'+k);el.hidden=false;el.dataset.k=k;const w=el.offsetWidth,h=el.offsetHeight;
 let left=clamp(r.left+r.width/2-w/2,10,innerWidth-w-10),top=r.top-h-16,below=false;if(top<10){top=r.bottom+16;below=true}
 if(M.mode==='m-land'){left=Math.max(10,r.left-w-16);top=clamp(r.top+r.height/2-h/2,10,innerHeight-h-10)}
 el.style.left=left+'px';el.style.top=top+'px';el.classList.toggle('below',below);el.classList.toggle('side',M.mode==='m-land');
 const ax=clamp(r.left+r.width/2-left,24,w-24);el.style.setProperty('--ax',ax+'px')}
function coachDone(k){SET.tips=Math.max(SET.tips||0,k);saveSettings();coachUpdate()}
$('#coachOk').onclick=()=>{const k=+$('#coach').dataset.k;coachDone(k===1?1:k===2?2:3)};
$('#coachX').onclick=()=>coachDone(3);
const _updateUI17=updateUI;updateUI=function(){_updateUI17();requestAnimationFrame(coachUpdate)};
const _play17=play;play=function(){if(AUTO.on)autoStop(true);const r=_play17();if((SET.tips||0)<3&&ST.frames.length>=3)coachDone(3);return r};
addEventListener('resize',()=>requestAnimationFrame(coachUpdate));
const _shoot17=shoot;shoot=async function(){const n=ST.frames.length;await _shoot17();if(ST.frames.length>n){buzzLite();if(n===0&&(SET.tips||0)<1)coachDone(1)}};
$('#setTips').onclick=()=>{SET.tips=0;saveSettings();toast(t('tipsAgain')+' ✓')};

/* --- réglage des sons --- */
$('#setSfx').checked=SET.sfx!==false;$('#setSfx').onchange=e=>{SET.sfx=e.target.checked;saveSettings()};
const _renderSettings17=renderSettings;renderSettings=function(){_renderSettings17();$('#setSfx').checked=SET.sfx!==false};

/* --- entrée / sortie du studio --- */
const _openProject17=openProject;openProject=async function(id,x){AUTO.on=false;ST.lightLock=false;await _openProject17(id,x);autoUI();$('#tAutoSecV').textContent=(SET.autoSec||3)+' s';wakeOn();coachUpdate()};
const _leaveStudio17=leaveStudio;leaveStudio=function(){autoStop(true);wakeOff();$('#coach').hidden=true;_leaveStudio17()};
const _setStep17=setStep;setStep=function(s){autoStop(true);_setStep17(s);coachUpdate()};
const _openSheet17=openSheet;openSheet=function(n){autoStop(true);_openSheet17(n);coachUpdate()};
const _closeSheet17=closeSheet;closeSheet=function(){_closeSheet17();setTimeout(coachUpdate,330)};

/* --- appli installable et utilisable hors ligne (version en ligne seulement) --- */
if('serviceWorker'in navigator&&location.protocol==='https:')addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

/* ================= DÉMARRAGE ================= */
(async function init(){loadSettings();applyTheme();applyI18n();const ok=await DB.open();if(!ok)toast(t('noStorage'));renderHome();getDl()})();
</script>
